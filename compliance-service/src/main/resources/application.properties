# Production Environment Configuration
spring.application.name=compliance-service

# Active Profile (Change to 'dev' for development)
spring.profiles.active=dev

# PostgreSQL Database Configuration (Production - Use environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rfid_compliance_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate Configuration (Production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Configuration (Production - Use environment variable for secret!)
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server Configuration
server.port=${SERVER_PORT:29288}
server.servlet.context-path=/autocomply

# Logging Configuration (Production - Less verbose)
logging.level.root=WARN
logging.level.com.example.compliance_service=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql=ERROR

# ?? MQTT / HiveMQ Configuration ??????????????????????????????????????????????
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:compliance-service}
mqtt.topic=${MQTT_TOPIC:rfid/fx9600/tag-reads}
mqtt.qos=${MQTT_QOS:1}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.reader-model=${MQTT_READER_MODEL:Zebra FX9600}
mqtt.reader-ip-fallback=${MQTT_READER_IP_FALLBACK:192.168.1.100}


# Development Environment Configuration
spring.application.name=compliance-service

# PostgreSQL Database Configuration (Development)
spring.datasource.url=jdbc:postgresql://localhost:5432/rfid_compliance_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration (Development)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Configuration (Development - Use a different secret in production!)
jwt.secret=dGhpcy1pcy1hLXZlcnktc2VjdXJlLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
jwt.expiration=86400000

# Server Configuration
server.port=29288
server.servlet.context-path=/autocomply

# Logging Configuration (Development - More verbose)
logging.level.root=INFO
logging.level.com.example.compliance_service=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql=ERROR

# DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
